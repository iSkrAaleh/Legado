{% extends 'legado/base.html' %}

{% block title %}Crear Familiar - Legado Digital{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="mb-8">
        <a href="{% url 'familiares' %}" class="text-slate-400 hover:text-white inline-flex items-center gap-2 transition-colors mb-4">
            <i class="fa-solid fa-arrow-left"></i> Volver a Familiares
        </a>
        <h1 class="text-3xl font-extrabold text-white">Crear Cuenta Familiar</h1>
        <p class="text-slate-400 mt-2">Crea un usuario y contraseña para que tu familiar pueda acceder al buscador de tu bóveda.</p>
    </div>

    <div class="glass rounded-2xl p-8 relative">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="mt-8 pt-6 border-t border-dark-border">
                <button type="submit" class="w-full py-3 rounded-lg bg-gradient-to-r from-brand-600 to-indigo-600 text-white font-bold text-lg hover:from-brand-500 hover:to-indigo-500 transition-all shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-user-check mr-2"></i> Crear y Conceder Acceso
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
