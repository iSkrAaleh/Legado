{% extends 'legado/base.html' %}

{% block title %}Cambiar Contraseña de Familiar - Legado Digital{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto space-y-6">
    <div class="mb-8">
        <a href="{% url 'familiares' %}" class="text-slate-400 hover:text-white inline-flex items-center gap-2 transition-colors mb-4">
            <i class="fa-solid fa-arrow-left"></i> Volver a Familiares
        </a>
        <h1 class="text-3xl font-extrabold text-white">Recuperar Contraseña</h1>
        <p class="text-slate-400 mt-2">Establece una nueva contraseña para el acceso de <strong class="text-white">{{ familiar_username }}</strong>.</p>
    </div>

    <div class="glass rounded-2xl p-8 relative">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="mt-8 pt-6 border-t border-dark-border">
                <button type="submit" class="w-full py-3 rounded-lg bg-indigo-600 text-white font-bold text-lg hover:bg-indigo-500 transition-colors shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid fa-save mr-2"></i> Actualizar Contraseña
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
